apply plugin: 'com.android.application'

android {
    // Google Play requires targetSdk 36 for updates since 2026-08-31; the last published release
    // (v1.55.0-omt.3) is targetSdk 35, so no update could be shipped to existing installs until
    // this line moved. compileSdk has to come with it — AGP will not let you compile against less
    // than you target.
    compileSdk 36
    compileOptions.encoding = 'UTF-8'

    defaultConfig {
        applicationId "io.github.ysdede.opencameraomt"
        minSdkVersion 21
        targetSdkVersion 36
        //compileSdkVersion 31 // needed to support appcompat:1.4.0 (which we need for emoji policy support, and not yet ready to target SDK 30)

        testApplicationId "net.sourceforge.opencamera.test"
        //testInstrumentationRunner "android.test.InstrumentationTestRunner"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // OMT: two ABIs, both built from source by app/src/main/cpp/CMakeLists.txt.
        // arm64-v8a binds the NEON codec (vmxcodec_arm.cpp + -DARM64); x86_64 binds the SSE/AVX2
        // codec (vmxcodec_x86.cpp + vmxcodec_avx2.cpp). Before 2026-10-15 this was arm64-only, which
        // forced the x86_64 emulator to run the ARM lib under libndk_translation and hid every
        // native-code problem behind that penalty.
        // NOTE: there are no prebuilt .so files in this repo (removed in 367b2be7) — an ABI listed
        // here that CMakeLists.txt does not know how to bind fails the configure step, by design.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // Load signing properties from local.properties (gitignored)
    def keystorePropertiesFile = rootProject.file("local.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystoreProperties['RELEASE_STORE_FILE']) {
                storeFile file(keystoreProperties['RELEASE_STORE_FILE'])
                storePassword keystoreProperties['RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['RELEASE_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // AGP 9 refuses getDefaultProguardFile('proguard-android.txt') outright: that file
            // carries -dontoptimize, which silently neuters R8's optimiser for anyone who later
            // flips minifyEnabled on. This build has minifyEnabled false, so R8 never runs and the
            // choice of default file changes nothing about the APK produced today — it only sets
            // the floor for whoever turns minification on next.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            // Only bind the release signing config when a keystore is actually configured. Without
            // this guard, assembleRelease fails in validateSigningRelease on any checkout that has
            // no local.properties (CI, a fresh clone) instead of producing an unsigned APK.
            if (keystoreProperties['RELEASE_STORE_FILE']) {
                signingConfig = signingConfigs.release
            }
        }
    }


    // needed to use android.test package (ActivityInstrumentationTestCase2 etc) when targetting sdk 28 (Android 9) -
    // see https://developer.android.com/training/testing/set-up-project
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
    namespace = 'net.sourceforge.opencamera'
    buildFeatures {
    }
    
    // OMT: CMake configuration for native JNI bridge
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version = "3.22.1"
        }
    }
    
    ndkVersion = "27.3.13750724"   // r27d; same r27 generation as the previous 27.0 pin
    //useLibrary 'android.test.mock'
}

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    //implementation 'androidx.activity:activity:1.9.3' // needed for EdgeToEdge.enable(this)

    // appcompat version must be 1.4.0 or later to satisfy emoji policy!
    implementation 'androidx.appcompat:appcompat:1.7.1'

    // needed to fix errors since upgrading to appcompat:1.7.0, see https://stackoverflow.com/questions/75263047/duplicate-class-in-kotlin-android
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.9.0"))

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    implementation 'androidx.exifinterface:exifinterface:1.4.1'

    testImplementation 'junit:junit:4.13.2'

    // newer AndroidJUnit4 InstrumentedTest
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Custom APK naming.
//
// This was `applicationVariants.all { variant -> variant.outputs.all { outputFileName = ... } }`.
// AGP 9 removed the old Variant API, and the androidComponents replacement exposes VariantOutput
// WITHOUT a writable outputFileName — setting it now throws "Cannot set readonly property:
// outputFileName" (issuetracker.google.com/issues/480062612 is still open, so there is no supported
// in-DSL rename left). What remains is to publish the finished APK under the expected name after
// assemble, which is what this does.
//
// The names produced are identical to before: OpenCameraOMT.apk for release,
// OpenCameraOMT-<buildType>.apk otherwise — deploy.ps1 and /home/reality/bin/omt-emulator-test.sh
// look those up. Two differences worth stating:
//   * the canonical AGP output (app-<variant>.apk) now stays in the directory alongside it, where
//     the old DSL replaced the name outright; and
//   * it is a finalizer of assemble, so anything that consumes the named file must go through
//     assemble, exactly as before.
// The task refuses to guess when the directory holds more than one candidate APK rather than
// picking one — a wrong-name leftover must not be able to be published as the real build.
def omtApkNameFor = { buildType -> buildType == "release" ? "BreadOMTCamera.apk" : "BreadOMTCamera-${buildType}.apk" }
androidComponents {
    onVariants(selector().all()) { variant ->
        def variantName = variant.name
        def desired = omtApkNameFor(variant.buildType)
        def outDir = layout.buildDirectory.dir("outputs/apk/${variantName}")
        def publish = tasks.register("publish${variantName.capitalize()}OmtApk") {
            description = "Publishes the ${variantName} APK as ${desired} (the AGP 9 replacement for outputFileName)."
            // Deliberately NO declared outputs: an output declaration lets Gradle mark this
            // UP-TO-DATE and skip the copy, which is precisely how a stale OpenCameraOMT-debug.apk
            // could sit next to a fresh build and get shipped. With no outputs it re-copies on
            // every assemble, and the named file can never be older than the APK it was copied from.
            doLast {
                def candidates = fileTree(outDir).matching { include "*.apk" }.files.findAll { it.name != desired }
                if (candidates.size() != 1) {
                    throw new GradleException("expected exactly one APK in ${outDir.get()}, found: " +
                            candidates.collect { it.name }.join(", ") + " — refusing to guess which one is the build")
                }
                def target = new File(outDir.get().asFile, desired)
                java.nio.file.Files.copy(candidates[0].toPath(), target.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                logger.lifecycle("OMT: published ${candidates[0].name} -> ${target.name} (${target.length()} bytes)")
            }
        }
        // tasks.matching{} is lazy: onVariants runs during configuration, before AGP has created
        // the assemble task, so tasks.named("assembleDebug") here fails with "Task with name
        // 'assembleDebug' not found".
        tasks.matching { it.name == "assemble${variantName.capitalize()}" }.configureEach { finalizedBy(publish) }
    }
}
